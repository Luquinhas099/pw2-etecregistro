<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 07 - Introdução ao JavaScript</title>
</head>
<body>
    <h1>Introdução ao JavaScript!</h1>
</body>
<!-- JavaScript -->
<script>
    // Dispara um alerta na tela do usuário
    window.alert("Bem-vindo ao meu primeiro site com JavaScript!");
    // Dispara uma janela de confirmação
    let resposta = window.confirm("Vamos começar a aprender sobre variáveis?");
    if(resposta){
        window.alert("Vamos lá")
    }
    else {
        window.alert("Poxa, que pena")
    }

    // Armazenando nome do usuário em uma variável
    const nome = window.prompt("Qual é o seu nome?")
    // window.prompt -> abre uma janela para inserção de dados

    // Escrevendo o site
    // Concatenação comum
    // document.write("Olá " + nome + ", vamos aprender sobre variáveis  <br>")

    // Concatenação Template String
    document.write(`Olá, ${nome}! Vamos começar!<br>`);

    let idade = window.prompt("Qual é a sua idade?")

    // Concatenação comum
    // document.write("Atualmente a sua idade é "+idade+ " anos")

    // Concatenação Template String
    document.write(`Atualmente a sua idade é ${idade} anos! <br>`)

    // Conversão de dados
    const n1 = Number(window.prompt('Digite um número'));
    const n2 = Number(window.prompt('Digite outro número'));

    const resultado = n1 + n2;

    document.write(`A soma de ${n1} + ${n2} é igual a: ${resultado} <br>`)

    if(resultado > 100){
        document.write('Que número grande!');
    }
    else{
        document.write('Que número pequeno!')
    }


</script>
</html>
