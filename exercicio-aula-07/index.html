<!DOCTYPE html>
<html lang="pt-br">

<body>
    
</body>
<script>

    const num1 = Number(window.prompt('Digite um número: '));
    const num2 = Number(window.prompt('Digite outro número: '));

    const resultado_soma = num1 + num2;
    const resultado_sub = num1 - num2;
    const resultado_div = num1 / num2;
    const resultado_mult = num1 * num2;

    document.write(`O resultado da soma de ${num1} + ${num2} é ${resultado_soma} <br>`);
    document.write(`O resultado da subtração de ${num1} - ${num2} é ${resultado_sub} <br>`);
    document.write(`O resultado da divisão de ${num1} / ${num2} é ${resultado_div} <br>`);
    document.write(`O resultado da multiplicação de ${num1} * ${num2} é ${resultado_mult} <br>`);

</script>
